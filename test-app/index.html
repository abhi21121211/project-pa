<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Todo App - Demo</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        #app {
            max-width: 500px;
            margin: 0 auto;
        }

        /* Header */
        #header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        #header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        #header p {
            opacity: 0.9;
        }

        /* Todo Container */
        #todo-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        /* Add Todo Form */
        #add-todo-form {
            display: flex;
            padding: 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #eee;
        }

        #todo-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        #todo-input:focus {
            outline: none;
            border-color: #667eea;
        }

        #add-btn {
            margin-left: 10px;
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #add-btn:hover {
            transform: scale(1.05);
        }

        /* Todo List */
        #todo-list {
            list-style: none;
            padding: 10px 0;
        }

        .todo-item {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.2s;
        }

        .todo-item:hover {
            background: #f8f9fa;
        }

        .todo-item.completed span {
            text-decoration: line-through;
            color: #999;
        }

        .todo-checkbox {
            width: 22px;
            height: 22px;
            margin-right: 15px;
            cursor: pointer;
        }

        .todo-text {
            flex: 1;
            font-size: 16px;
        }

        .delete-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .todo-item:hover .delete-btn {
            opacity: 1;
        }

        /* Stats */
        #stats {
            display: flex;
            justify-content: space-between;
            padding: 15px 20px;
            background: #f8f9fa;
            font-size: 14px;
            color: #666;
        }

        /* Filter Buttons */
        #filters {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 15px;
            background: #f8f9fa;
            border-top: 1px solid #eee;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        /* Empty State */
        #empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        /* Admin Link (Protected Route Example) */
        #admin-link {
            display: block;
            text-align: center;
            padding: 15px;
            background: #2d3748;
            color: #ffd700;
            text-decoration: none;
            font-weight: bold;
        }

        #admin-link:hover {
            background: #1a202c;
        }
    </style>
</head>

<body>
    <div id="app"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function TodoApp() {
            const [todos, setTodos] = useState([
                { id: 1, text: 'Learn React', completed: true },
                { id: 2, text: 'Build a Todo App', completed: false },
                { id: 3, text: 'Test Project PA CLI', completed: false }
            ]);
            const [inputValue, setInputValue] = useState('');
            const [filter, setFilter] = useState('all');

            const addTodo = (e) => {
                e.preventDefault();
                if (!inputValue.trim()) return;
                setTodos([...todos, {
                    id: Date.now(),
                    text: inputValue,
                    completed: false
                }]);
                setInputValue('');
            };

            const toggleTodo = (id) => {
                setTodos(todos.map(todo =>
                    todo.id === id ? { ...todo, completed: !todo.completed } : todo
                ));
            };

            const deleteTodo = (id) => {
                setTodos(todos.filter(todo => todo.id !== id));
            };

            const filteredTodos = todos.filter(todo => {
                if (filter === 'active') return !todo.completed;
                if (filter === 'completed') return todo.completed;
                return true;
            });

            const completedCount = todos.filter(t => t.completed).length;

            return (
                <div>
                    <div id="header">
                        <h1>📝 React Todo</h1>
                        <p>A simple and beautiful todo application</p>
                    </div>

                    <div id="todo-container">
                        <a id="admin-link" href="/admin">🔐 Admin Dashboard (Protected)</a>

                        <form id="add-todo-form" onSubmit={addTodo}>
                            <input
                                id="todo-input"
                                type="text"
                                placeholder="What needs to be done?"
                                value={inputValue}
                                onChange={(e) => setInputValue(e.target.value)}
                            />
                            <button id="add-btn" type="submit">Add</button>
                        </form>

                        {filteredTodos.length === 0 ? (
                            <div id="empty-state">
                                <p>🎉 No todos here!</p>
                            </div>
                        ) : (
                            <ul id="todo-list">
                                {filteredTodos.map(todo => (
                                    <li key={todo.id} className={`todo-item ${todo.completed ? 'completed' : ''}`}>
                                        <input
                                            type="checkbox"
                                            className="todo-checkbox"
                                            checked={todo.completed}
                                            onChange={() => toggleTodo(todo.id)}
                                        />
                                        <span className="todo-text">{todo.text}</span>
                                        <button className="delete-btn" onClick={() => deleteTodo(todo.id)}>
                                            Delete
                                        </button>
                                    </li>
                                ))}
                            </ul>
                        )}

                        <div id="stats">
                            <span>{completedCount} of {todos.length} completed</span>
                            <span>{todos.length - completedCount} remaining</span>
                        </div>

                        <div id="filters">
                            <button
                                className={`filter-btn ${filter === 'all' ? 'active' : ''}`}
                                onClick={() => setFilter('all')}
                            >All</button>
                            <button
                                className={`filter-btn ${filter === 'active' ? 'active' : ''}`}
                                onClick={() => setFilter('active')}
                            >Active</button>
                            <button
                                className={`filter-btn ${filter === 'completed' ? 'active' : ''}`}
                                onClick={() => setFilter('completed')}
                            >Completed</button>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('app')).render(<TodoApp />);
    </script>
</body>

</html>
